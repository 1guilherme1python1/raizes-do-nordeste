<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="100%" height="100%" style="background-color: #FFFFFF; font-family: Arial, Helvetica, sans-serif;">
<defs>
      <marker id="arrow-solid" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M1,1.5 L8,4.5 L1,7.5 Z" fill="#000000" />
      </marker>
      <marker id="arrow-open" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M1,1.5 L8,4.5 L1,7.5" fill="none" stroke="#000000" stroke-width="1.4" />
      </marker>
    </defs>
<line x1="120" y1="64" x2="120" y2="615" stroke="#CCCCCC" stroke-width="1.6" stroke-dasharray="6,4" />
<line x1="380" y1="64" x2="380" y2="615" stroke="#CCCCCC" stroke-width="1.6" stroke-dasharray="6,4" />
<line x1="640" y1="64" x2="640" y2="615" stroke="#CCCCCC" stroke-width="1.6" stroke-dasharray="6,4" />
<line x1="860" y1="64" x2="860" y2="615" stroke="#CCCCCC" stroke-width="1.6" stroke-dasharray="6,4" />
<rect x="50" y="75" width="260" height="20" rx="3" ry="3" fill="#F3F4F6" stroke="#000000" stroke-width="0.8" />
<text x="180" y="89" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#000000">ETAPA 1: CRIAÇÃO E RESERVA DE ESTOQUE</text>
<line x1="120" y1="115" x2="375" y2="115" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-solid)" />
<rect x="80.0" y="98" width="340" height="15" fill="#FFFFFF" />
<text x="250.0" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">1. POST /api/v1/pedidos (criação do pedido multicanal)</text>
<line x1="380" y1="155" x2="635" y2="155" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-solid)" />
<rect x="340.0" y="138" width="340" height="15" fill="#FFFFFF" />
<text x="510.0" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">2. Valida estoque e trava saldo (PESSIMISTIC_WRITE)</text>
<line x1="640" y1="195" x2="385" y2="195" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
<rect x="340.0" y="178" width="340" height="15" fill="#FFFFFF" />
<text x="510.0" y="190" text-anchor="middle" font-size="10" fill="#000000">3. Saldo reservado e pedido gravado (AGUARDANDO_PAGAMENTO)</text>
<line x1="380" y1="235" x2="125" y2="235" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
<rect x="80.0" y="218" width="340" height="15" fill="#FFFFFF" />
<text x="250.0" y="230" text-anchor="middle" font-size="10" fill="#000000">4. HTTP 201 Created (retorna ID do pedido e tempo de expiração)</text>
<line x1="40" y1="270" x2="940" y2="270" stroke="#000000" stroke-width="1.0" stroke-dasharray="4,4" />
<rect x="360" y="259" width="260" height="22" rx="3" ry="3" fill="#000000" />
<text x="490" y="274" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#FFFFFF">ETAPA 2: SIMULAÇÃO E CONFIRMAÇÃO DE PAGAMENTO</text>
<line x1="120" y1="315" x2="375" y2="315" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-solid)" />
<rect x="80.0" y="298" width="340" height="15" fill="#FFFFFF" />
<text x="250.0" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">5. POST /api/v1/pagamentos/simular { cenario: APROVAR }</text>
<line x1="380" y1="360" x2="855" y2="360" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-solid)" />
<rect x="450.0" y="343" width="340" height="15" fill="#FFFFFF" />
<text x="620.0" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">6. Envia autorização com Idempotency-Key ao Gateway Mock</text>
<line x1="860" y1="410" x2="385" y2="410" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
<rect x="450.0" y="393" width="340" height="15" fill="#FFFFFF" />
<text x="620.0" y="405" text-anchor="middle" font-size="10" fill="#000000">7. Retorno síncrono: APROVADO (transacaoId gerado)</text>
<line x1="380" y1="460" x2="635" y2="460" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow-solid)" />
<rect x="340.0" y="443" width="340" height="15" fill="#FFFFFF" />
<text x="510.0" y="455" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">8. Atualiza pedido para CONFIRMADO e baixa estoque físico</text>
<line x1="640" y1="510" x2="385" y2="510" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
<rect x="340.0" y="493" width="340" height="15" fill="#FFFFFF" />
<text x="510.0" y="505" text-anchor="middle" font-size="10" fill="#000000">9. Commit atômico e inserção de registro de auditoria</text>
<line x1="380" y1="560" x2="125" y2="560" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)" />
<rect x="80.0" y="543" width="340" height="15" fill="#FFFFFF" />
<text x="250.0" y="555" text-anchor="middle" font-size="10" fill="#000000">10. HTTP 200 OK (Pedido confirmado e liberado para preparo)</text>
<rect x="35.0" y="15" width="170" height="48" rx="3" ry="3" fill="#000000" stroke="#000000" stroke-width="1.2" />
<text x="120" y="35" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Cliente</text>
<text x="120" y="52" text-anchor="middle" font-size="9.5" fill="#CCCCCC">(App / Web / Totem)</text>
<rect x="35.0" y="615" width="170" height="48" rx="3" ry="3" fill="#000000" stroke="#000000" stroke-width="1.2" />
<text x="120" y="635" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Cliente</text>
<text x="120" y="652" text-anchor="middle" font-size="9.5" fill="#CCCCCC">(App / Web / Totem)</text>
<rect x="295.0" y="15" width="170" height="48" rx="3" ry="3" fill="#000000" stroke="#000000" stroke-width="1.2" />
<text x="380" y="35" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">API Back-End</text>
<text x="380" y="52" text-anchor="middle" font-size="9.5" fill="#CCCCCC">(Spring Boot 3 / REST)</text>
<rect x="295.0" y="615" width="170" height="48" rx="3" ry="3" fill="#000000" stroke="#000000" stroke-width="1.2" />
<text x="380" y="635" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">API Back-End</text>
<text x="380" y="652" text-anchor="middle" font-size="9.5" fill="#CCCCCC">(Spring Boot 3 / REST)</text>
<rect x="555.0" y="15" width="170" height="48" rx="3" ry="3" fill="#000000" stroke="#000000" stroke-width="1.2" />
<text x="640" y="35" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Banco de Dados</text>
<text x="640" y="52" text-anchor="middle" font-size="9.5" fill="#CCCCCC">(PostgreSQL 16 / ACID)</text>
<rect x="555.0" y="615" width="170" height="48" rx="3" ry="3" fill="#000000" stroke="#000000" stroke-width="1.2" />
<text x="640" y="635" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Banco de Dados</text>
<text x="640" y="652" text-anchor="middle" font-size="9.5" fill="#CCCCCC">(PostgreSQL 16 / ACID)</text>
<rect x="775.0" y="15" width="170" height="48" rx="3" ry="3" fill="#000000" stroke="#000000" stroke-width="1.2" />
<text x="860" y="35" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Gateway Pagamento</text>
<text x="860" y="52" text-anchor="middle" font-size="9.5" fill="#CCCCCC">(Mock / Idempotente)</text>
<rect x="775.0" y="615" width="170" height="48" rx="3" ry="3" fill="#000000" stroke="#000000" stroke-width="1.2" />
<text x="860" y="635" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Gateway Pagamento</text>
<text x="860" y="652" text-anchor="middle" font-size="9.5" fill="#CCCCCC">(Mock / Idempotente)</text>
</svg>